# Local development profile: H2 in-memory DB, Kafka consumer disabled, no Redis required
spring.datasource.url=jdbc:h2:mem:fraud_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration

ml.service.url=http://127.0.0.1:8001

kafka.producer.fallback-to-direct=true
kafka.producer.send-timeout-seconds=2
